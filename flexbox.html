<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      .container {
        height: 600px;
        border: 2px solid red;
        background-color: azure;

        display: flex;
        justify-content: space-evenly;
        align-items: center;
        flex-direction: row;
      }
      .box {
        border: 1px solid brown;
        background-color: beige;
        width: 300px;
        height: 100px;
        font-size: 32px;
        font-weight: bold;
        text-align: center;
        padding-top: 30px;
      }
    </style>
  </head>
  <body>
    <h1>Flex Box Basics</h1>
    <h2>Flex Box allows us to create responsive websites</h2>
    <div class="container">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
    </div>
  </body>
</html>
