<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <style>
        form {
            width: 500px;
        }

        .form-label {
            color: rgb(74, 144, 226)
        }
    </style>
</head>

<body>
    <h1 class="text-center my-3">Contact Us Form </h1>
    <form action="" class="border shadow-lg p-4 rounded mx-auto">
        <div class="mb-3">
            <label for="nameTextBox" class="form-label">Name: </label>
            <input type="text" name="nameTextBox" id="nameTextBox" placeholder="Enter your full name"
                class="form-control">
        </div>
        <div class="mb-3">
            <label for="emailTextBox" class="form-label">Email:</label>
            <input type=" email" name="emailTextBox" id="emailTextBox" placeholder="Enter your Email"
                class="form-control">
            <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
        </div>
        <div class="mb-3">
            <label for="queryTextBox" class="form-label">Query:</label>
            <textarea name=" queryTextBox" id="queryTextBox" placeholder="Enter your query" class="form-control"
                rows="5"></textarea>
        </div>
        <div>
            <button class="btn btn-primary w-100">Submit</button>
        </div>
    </form>
</body>

</html>
